# Testes noturnos.
#  - Sessão longa (T.05): 2 h de ditado aceleradas contra o simulador; memória estável.
#  - E2E-13: áudio real do autor (bucket privado "benchmark") com o provedor escolhido
#    no benchmark (F1.04): sem quedas, latência p95 < 1,5 s e erro dentro do limite.
#    Fica inativo até existirem os segredos NIGHTLY_STT_PROVIDER, a chave do provedor
#    e o áudio no bucket.
# O benchmark completo (três provedores) roda à mão pelo "Run workflow".
name: Noturno

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      benchmark:
        description: 'Rodar o benchmark completo (F1.04) em vez do teste do provedor escolhido'
        type: boolean
        default: false

jobs:
  sessao-longa:
    name: Sessão longa (T.05)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: 2 h de ditado aceleradas
        env:
          SOAK_MINUTES: '120'
          NODE_OPTIONS: --expose-gc
        run: pnpm --filter @livro/session exec vitest run src/soak.test.ts --reporter=verbose

  provedor-real:
    name: E2E-13 com o provedor real
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      NIGHTLY_STT_PROVIDER: ${{ secrets.NIGHTLY_STT_PROVIDER }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      DEEPGRAM_API_KEY: ${{ secrets.DEEPGRAM_API_KEY }}
      ASSEMBLYAI_API_KEY: ${{ secrets.ASSEMBLYAI_API_KEY }}
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
    steps:
      - name: Verifica a configuração
        id: ready
        run: |
          if [ -z "$NIGHTLY_STT_PROVIDER" ] && [ "${{ inputs.benchmark }}" != "true" ]; then
            echo "::notice::E2E-13 inativo: defina o segredo NIGHTLY_STT_PROVIDER (provedor escolhido no benchmark F1.04)."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v5
        if: steps.ready.outputs.ok == 'true'
      - uses: pnpm/action-setup@v4
        if: steps.ready.outputs.ok == 'true'
      - uses: actions/setup-node@v5
        if: steps.ready.outputs.ok == 'true'
        with:
          node-version: 24
          cache: pnpm
      - if: steps.ready.outputs.ok == 'true'
        run: pnpm install --frozen-lockfile
      - name: Baixa o áudio do autor (bucket privado)
        if: steps.ready.outputs.ok == 'true'
        run: pnpm --filter @livro/session exec tsx scripts/fetch-benchmark.ts ${{ inputs.benchmark && 'amostras' || 'noturno' }} "$RUNNER_TEMP/audio"
      - name: Transcreve no ritmo real
        if: steps.ready.outputs.ok == 'true'
        run: |
          PROVIDERS="${{ inputs.benchmark && 'deepgram,assemblyai,elevenlabs' || secrets.NIGHTLY_STT_PROVIDER }}"
          pnpm --filter @livro/session exec tsx scripts/benchmark.ts "$RUNNER_TEMP/audio" --providers "$PROVIDERS" --out "$RUNNER_TEMP/resultado.md"
          cat "$RUNNER_TEMP/resultado.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Confere os limites (E2E-13)
        if: steps.ready.outputs.ok == 'true' && !inputs.benchmark
        run: pnpm --filter @livro/session exec tsx scripts/check-benchmark.ts "$RUNNER_TEMP/resultado.json" --max-wer "${{ vars.NIGHTLY_MAX_WER || '0.08' }}" --max-p95 1500
